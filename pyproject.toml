[project]
name = "mlops-at-scale"
version = "0.1.0"
description = "Working through Carl Osipov's MLOps Engineering at Scale"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "pandas>=3.1.0",
    "s3fs>=2026.9.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "UP", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
